[supervisord]
nodaemon=true
logfile=/var/log/panel/supervisord.log
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/panel/php-fpm.log
stderr_logfile=/var/log/panel/php-fpm-err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/panel/nginx-out.log
stderr_logfile=/var/log/panel/nginx-err.log

[program:crond]
command=/usr/sbin/crond -f -d 8
autostart=true
autorestart=true
priority=31
stdout_logfile=/var/log/panel/crond.log
stderr_logfile=/var/log/panel/crond-err.log

[program:stt]
; Honest guard: stay idle unless BOTH the engine binary and a readable model
; exist. /opt/stt/models may be a read-only host bind-mount that hides the
; image-baked model, so /opt/stt/baked is an equal, in-image fallback.
command=/bin/sh -c "M=''; if [ -r /opt/stt/models/ggml-small.en-q5_0.bin ]; then M='/opt/stt/models/ggml-small.en-q5_0.bin'; elif [ -r /opt/stt/baked/ggml-small.en-q5_0.bin ]; then M='/opt/stt/baked/ggml-small.en-q5_0.bin'; fi; if [ -x /opt/stt/whisper-server ] && [ -n \"$M\" ]; then echo \"stt: starting whisper-server with $M\" >&2; exec /opt/stt/whisper-server -m \"$M\" --host 127.0.0.1 --port 8713 --public /opt/stt/public --convert; else echo \"stt: engine or model missing (model=${M:-absent}); staying idle\" >&2; sleep 3600; fi"
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/panel/stt.log
stderr_logfile=/var/log/panel/stt-err.log
