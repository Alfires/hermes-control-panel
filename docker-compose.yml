services:
  panel:
    build: .
    image: hermes-control-panel:local
    container_name: hermes-panel
    restart: unless-stopped
    env_file: ./panel.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9120:8080"
    volumes:
      - ./data:/var/lib/panel
      # A directory is mounted (not the socket files): the relays recreate
      # their sockets on broker restart and the container sees the new inode.
      # PHP workers run as uid 1000 (deck), the only group allowed to connect.
      - /opt/panel-sockets:/run/panel-sockets
      # Root-only HMAC key; entrypoint copies it to a 0400 uid-1000 file.
      - /opt/panel-secrets/hostctl.key:/run/hostctl-src/hostctl.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api.php?action=me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
