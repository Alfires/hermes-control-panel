services:
  hermes:
    # Standalone option only. The production Deck already runs the gateway from
    # /opt/hermes on 8642/9119, so this service is behind a profile and is NOT
    # started by a plain `docker compose up -d` (which would collide on ports).
    profiles: ["standalone"]
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    env_file: ./panel.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8642:8642"
      - "9119:9119"
    volumes:
      - ./data/hermes:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  webui:
    build: .
    image: hermes-control-panel:local
    container_name: hermes-panel
    restart: unless-stopped
    env_file: ./panel.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEBUI_PORT:-9120}:8080"
    volumes:
      - ./data:/var/lib/panel
      - ./data/stt-models:/opt/stt/models:ro
      # Directory mounts (not socket files) so relays survive broker restarts.
      - /opt/panel-sockets:/run/panel-sockets
      - /opt/panel-secrets/hostctl.key:/run/hostctl-src/hostctl.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
